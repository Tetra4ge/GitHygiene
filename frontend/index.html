<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <!-- <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="description"
    content="GitHygiene — dependency health and security intelligence for your GitHub repositories. Built for Hacktoberfest Hack Day Coimbatore 2026." />
  <meta name="theme-color" content="#060b14" />
  <title>GitHygiene</title>
  <script>
    // Applied synchronously, before first paint, so the page never flashes
    // the wrong theme on load. Kept in sync with src/lib/themeStore.ts.
    (function () {
      try {
        var stored = localStorage.getItem('githygiene.theme');
        var theme = stored === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
